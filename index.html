<style>

    --shadow:0 8px 30px rgba(0,0,0,.4);

}
:root[data-theme="dark"]{
  --bg1:#141417; --bg2:#1a1918; --bg3:#13171a;

.modal-bg{position:fixed;inset:0;background:rgba(10,8,20,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.modal{max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:20px;background:var(--glass-strong)}
.modal h3{margin:0 0 8px}
.modal textarea{min-height:220px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.tip{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin:0 3px;border-radius:50%;font-size:11px;line-height:1;color:var(--accent);background:none;cursor:help;vertical-align:1px;font-weight:400;flex:none}
.tip:focus{outline:2px solid var(--accent)}
.tipbox{position:fixed;z-index:40;padding:10px 12px;font-size:13px;line-height:1.6;white-space:pre-wrap;display:none;background:var(--glass-strong);border-radius:12px;pointer-events:none}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg1);padding:8px 18px;border-radius:999px;z-index:30;font-size:14px}
.empty{color:var(--muted);text-align:center;padding:24px}
.ro{padding:6px 2px;min-height:1.6em;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.ro.dim{color:var(--muted)}
.robar{display:flex;align-items:center;gap:10px;padding:10px 16px;margin-bottom:12px;font-size:14px}
.robar b{color:var(--accent)}
.robtn{display:none}
.vislist{display:flex;flex-direction:column;gap:6px}.visopt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:12px;cursor:pointer}

.ctag.ev{border-color:var(--accent);color:var(--accent)}
.qlist{display:flex;flex-direction:column;gap:4px}

.qfav.on{color:var(--hp)}.qfav.on .ic{fill:currentColor}.qfav:hover{color:var(--hp)}
.qbtn{border:1px solid var(--line);background:var(--glass-soft);border-radius:10px;padding:6px 10px;text-align:left;line-height:1.5;color:var(--ink);cursor:pointer}
.qbtn:hover{border-color:var(--accent);background:var(--accent-soft)}
.accxr{display:flex;gap:6px;align-items:center}.accxr>span.muted{font-size:12px;white-space:nowrap}.accxr .nh{width:80px;flex:none}
tr.accx td{border-top:0;padding-top:0}
.origblk{margin:8px 0 10px}
#origcard .visrow{white-space:nowrap}
.obh{display:flex;align-items:center;gap:10px;margin-bottom:8px}.obh b{font-size:15px}.obh .btn{margin-left:auto}
.origt td{padding:4px}.origt textarea{min-height:38px;height:38px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{width:auto;flex:1 1 160px}
.clist{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.ccard{padding:16px;cursor:pointer;display:flex;gap:12px;align-items:center}
.ccard:hover{border-color:var(--accent)}

  .sidenav{display:flex;gap:4px;overflow-x:auto;padding:6px;border-radius:14px}.sidenav .sgh,.setbtn{display:none}.robtn{display:inline-flex}.sg,.sg .sgi{display:flex!important;padding:0;flex:0 0 auto}.sni{white-space:nowrap;width:auto;flex:0 0 auto;font-size:13px;padding:6px 8px}}

  .idrow{grid-template-columns:repeat(3,1fr)}.idrow .nm{grid-column:1/-1;order:-1}

  .meta{grid-template-columns:repeat(2,1fr)}
  .nav .brand{display:none}

    money: money[ci], honor: honor[ci], shards: shards[ci], lvCap };

function humanCond(src) {
  const lab = r => r === '冒險者Lv' ? '冒險者等級' : r;
  const ph = [];
  let s = str(src).replace(/\(\s*((?:\(\s*\[[^\]]+\]\s*>=\s*\d+\s*\)\s*\+?\s*)+)\)\s*(?:>=\s*(\d+))?/g, (m, inner, n) => {
    const items = [...inner.matchAll(/\[([^\]]+)\]\s*>=\s*(\d+)/g)].map(x => `${lab(x[1])} ${x[2]}`);
    ph.push(n && n !== '1' ? `下列 ${n} 項以上（${items.join('／')} 以上）` : `下列任一（${items.join('／')} 以上）`);
    return `@@${ph.length - 1}@@`;
  });
  let i = 0;
  const ws = () => { while (s[i] === ' ') i++; };
  const peekWord = w => { ws(); return s.slice(i, i + w.length).toUpperCase() === w; };
  function prim() {
    ws();
    let m = s.slice(i).match(/^@@(\d+)@@/); if (m) { i += m[0].length; return ph[+m[1]]; }
    for (const fn of ['AND', 'OR']) if (peekWord(fn + '(')) {
      i += fn.length + 1; const parts = [];
      while (true) { parts.push(expr()); ws(); if (s[i] === ',') { i++; continue; } if (s[i] === ')') { i++; break; } throw 0; }
      return fn === 'AND' ? parts.join('、') : '（' + parts.join(' 或 ') + '）';
    }
    if (peekWord('HAS(')) { i += 4; ws(); m = s.slice(i).match(/^"([^"]*)"\s*\)/); if (!m) throw 0; i += m[0].length; return '已有' + m[1].replace(/^[△💬≫▶◯☆]+/u, ''); }
    if (s[i] === '(') { i++; const e = expr(); ws(); if (s[i] !== ')') throw 0; i++; return e; }
    m = s.slice(i).match(/^\[([^\]]+)\]\s*(>=|<=|>|<|=)\s*(\d+)/);
    if (m) { i += m[0].length; const op = { '>=': ' 以上', '<=': ' 以下', '>': ' 以上（不含）', '<': ' 未滿', '=': '' }[m[2]]; return `${lab(m[1])} ${m[3]}${op}`; }
    throw 0;
  }
  function expr() { let a = prim(); while (true) { if (peekWord('AND ')) { i += 3; a += '、' + prim(); } else if (peekWord('OR ')) { i += 2; a += ' 或 ' + prim(); } else break; } return a; }
  try { const out = expr(); ws(); if (i < s.length) throw 0; return out; } catch (e) { return str(src); }
}

function getPath(o, p) { return p.split('.').reduce((a, k) => (a == null ? undefined : a[k]), o); }
function setPath(o, p, val) {

  ks.slice(0, -1).forEach((k, i) => { if (cur[k] == null) cur[k] = /^\d+$/.test(ks[i + 1]) ? [] : {}; cur = cur[k]; });
  cur[ks[ks.length - 1]] = val;
}
function inp(path, o = {}) {
  const val = getPath(CH, path) ?? '';

    let t = val;
    if (o.opts) { const hit = o.opts.map(x => Array.isArray(x) ? x : [x, x]).find(([v]) => String(v) === String(val)); t = hit ? hit[1] : val; }
    return str(t) === '' || str(t) === '—' ? `<div class="ro dim">—</div>` : `<div class="ro">${esc(t)}</div>`;
  }
  const dis = EDIT() ? '' : ' disabled';
  const a = `data-path="${esc(path)}"${o.num ? ' data-num' : ''}${o.ph ? ` placeholder="${esc(o.ph)}"` : ''}${dis}${o.list ? ` list="${o.list}"` : ''}`;
  if (o.area) return `<textarea ${a}>${esc(val)}</textarea>`;
  if (o.opts) return `<select ${a}>${o.opts.map(x => Array.isArray(x) ? x : [x, x]).map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(val) ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  return `<input type="${o.num ? 'number' : 'text'}"${o.num ? ' inputmode="numeric"' : ''} ${a} value="${esc(val)}"${o.min !== undefined ? ` min="${o.min}"` : ''}${o.max !== undefined ? ` max="${o.max}"` : ''}>`;
}
function sepSelect(path, groups, cur, first) {
  if (!EDIT()) return `<div class="ro${str(cur) ? '' : ' dim'}">${esc(str(cur) || (first ? first[1] : '—'))}</div>`;
  let found = false;

const PW_RE = /^[A-Za-z]{4,32}$/;
const PW_HINT = '限英文字母 4～32 字，區分大小寫';
function unlock() {
  const bg = modal(`<h3>編輯這張角色卡</h3>
    <p class="muted" style="margin-top:0">請輸入建立角色時設定的<b>密碼</b>（區分大小寫）。舊角色卡亦可貼上原編輯網址。此裝置將保留編輯權限。</p>

  const go2 = async () => {
    const raw = $('#uk', bg).value.trim();

    if (await api('checkKey', CH.id, k)) { KEY = k; KEYS.set(CH.id, k); bg.remove(); toast('已取得編輯權限'); renderSheet(); }
    else $('#um', bg).textContent = '密碼錯誤（請注意大小寫）';
  };
  $('#ug', bg).onclick = go2;
  $('#uk', bg).onkeydown = e => { if (e.key === 'Enter') go2(); };
  $('#uk', bg).focus();
}
function askPassword(title, note) {
  return new Promise(res => {
    const bg = modal(`<h3>${title}</h3><p class="muted" style="margin-top:0">${note}</p>
      <label class="f">密碼<input id="p1" type="password" autocomplete="new-password"></label>
      <label class="f" style="margin-top:8px">再輸入一次<input id="p2" type="password" autocomplete="new-password"></label>
      <div class="toolbar" style="margin-top:12px"><span class="muted" id="pm">${PW_HINT}</span><button class="btn ghost" id="pc" style="margin-left:auto">取消</button><button class="btn primary" id="po">確定</button></div>`);
    const done = v => { bg.remove(); res(v); };
    $('#pc', bg).onclick = () => done(null);
    $('#po', bg).onclick = () => {
      const a = $('#p1', bg).value, b = $('#p2', bg).value;
      if (!PW_RE.test(a)) { $('#pm', bg).textContent = PW_HINT; $('#pm', bg).style.color = 'var(--hp)'; return; }
      if (a !== b) { $('#pm', bg).textContent = '兩次輸入不一樣'; $('#pm', bg).style.color = 'var(--hp)'; return; }
      done(a);
    };
    $('#p1', bg).focus();
  });
}
async function changePassword() {

  try { await api('changeKey', CH.id, KEY, pw); KEY = pw; KEYS.set(CH.id, pw); toast('密碼已更新'); }

function tidyNote(t) {
  const lines = str(t).split(/\n/);
  let out = '';
  lines.forEach((l, i) => {
    const cur = l.replace(/^[ \t]+/, '');
    if (i === 0) { out = cur; return; }
    const prev = out.slice(-1);
    const keep = /^[●○◆・※①-⑳\d０-９　]/.test(l) || /[。：:）)]$/.test(out) && /^[　●①-⑳]/.test(l) || cur === '' || prev === '' || /^\s*$/.test(lines[i - 1]);
    out += keep ? '\n' + cur : cur;
  });
  return out.replace(/\n{3,}/g, '\n\n');
}

function tipFor(text) {
  const t = str(text).replace(/[：:]$/, '');
  if (!t || !M.tips || ['修正', 'G'].includes(t)) return '';
  if (M.tips[t]) return M.tips[t];
  const k = Object.keys(M.tips).find(k => k.length > 1 && (k.startsWith(t) && /^[【(（判]/.test(k.slice(t.length)) || t.startsWith(k) && /^[（(]/.test(t.slice(k.length))));
  return k ? M.tips[k] : '';
}
function decorateTips(root) {
  $$('.card h2, .sbox .l, .fl, th, .kv > div:nth-child(odd), [data-tipkey], .accl b, .gt', root).forEach(el => {
    if (el.querySelector(':scope > .tip') || el.closest('table.abt thead')) return;
    const key = el.dataset.tipkey || (el.childNodes[0] && el.childNodes[0].nodeType === 3 ? el.childNodes[0].textContent : el.textContent);
    const t = tipFor(str(key).split('\n')[0]);
    if (!t) return;
    const s = document.createElement('span'); s.className = 'tip'; s.tabIndex = 0; s.innerHTML = ic('info'); s.dataset.tip = t;
    if (el.childNodes[0] && el.childNodes[0].nodeType === 3) el.insertBefore(s, el.childNodes[1] || null); else el.appendChild(s);
  });
}
(function () {
  let box = null;
  const show = el => {
    if (!box) { box = document.createElement('div'); box.className = 'tipbox glass'; document.body.appendChild(box); }
    box.textContent = tidyNote(el.dataset.tip); box.style.display = 'block';
    const r = el.getBoundingClientRect(), bw = Math.min(360, window.innerWidth - 24);
    box.style.width = bw + 'px';
    const left = Math.min(Math.max(12, r.left - 10), window.innerWidth - bw - 12);
    box.style.left = left + 'px';
    const h = box.offsetHeight;
    box.style.top = (r.bottom + 8 + h > window.innerHeight ? Math.max(8, r.top - h - 8) : r.bottom + 8) + 'px';
  };
  const hide = () => { if (box) box.style.display = 'none'; };
  document.addEventListener('mouseover', e => { const t = e.target.closest && e.target.closest('.tip'); if (t) show(t); });
  document.addEventListener('mouseout', e => { if (e.target.closest && e.target.closest('.tip')) hide(); });
  document.addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('tip')) show(e.target); });
  document.addEventListener('focusout', hide);
  document.addEventListener('scroll', hide, true);
})();

function migrateOrig(ch) {
  ch.orig.skills = ch.orig.skills.map(x => Object.assign(BLANK.origSkill(), x, { 能力: Array.isArray(x.能力) ? x.能力 : [] }));
  ch.orig.races = ch.orig.races.map(x => Object.assign(BLANK.origRace(), x, { 特徵: Array.isArray(x.特徵) ? x.特徵 : [] }));
}
function migrate(ch) {
  if (!['public', 'unlisted', 'private'].includes(ch.vis)) ch.vis = 'public';
  if (!Array.isArray(ch.tags)) ch.tags = [];
  ch.owner = str(ch.owner); ch.event = str(ch.event);
  if (!ch.orig || typeof ch.orig !== 'object') ch.orig = {};
  ['skills', 'races', 'extra'].forEach(k => { if (!Array.isArray(ch.orig[k])) ch.orig[k] = []; });
  if ((ch.customSkills || []).some(c => str(c.name))) {
    ch.skills = ch.skills || {};
    ch.customSkills.filter(c => str(c.name)).forEach(c => {
      ch.orig.skills.push(Object.assign(BLANK.origSkill(), { 名稱: str(c.name), 分類: c.type || '其他系', 經驗表: /^[AB]$/.test(str(c.exp)) ? str(c.exp) : 'A', 迴避: !!c.evade, 備註: str(c.note) }));
      ch.skills[str(c.name)] = num(c.lv);
    });
  }
  ch.customSkills = [];
  if ((ch.custom || []).length) { ch.orig.extra.push(...ch.custom); ch.custom = []; }
  migrateOrig(ch);
  if ((ch.schools || []).some(x => x && !Array.isArray(x.arts))) {
    const out = [];
    ch.schools.forEach(x => {
      if (Array.isArray(x.arts)) { out.push(x); return; }
      const nm = str(x.school);
      let b = out.find(y => (y.school === '__custom' ? str(y.customName) : str(y.school)) === nm && nm);
      if (!b) out.push(b = { school: nm, customName: '', entry: x.entry, arts: [] });
      else if (num(x.entry) > num(b.entry)) b.entry = x.entry;
      if (str(x.name) || str(x.honor)) b.arts.push({ name: str(x.name), type: str(x.type), honor: x.honor });
    });
    ch.schools = out;
  }
  if ((ch.ammo || []).some(x => x && ('ammo' in x || 'cap' in x))) {
    ch.ammoBox = ch.ammoBox || [];
    ch.ammo = ch.ammo.map(x => {
      if (!('ammo' in x || 'cap' in x)) return x;
      if (str(x.box) && !ch.ammoBox.some(b => str(b.name) === str(x.box))) ch.ammoBox.push({ name: str(x.box), cap: x.cap, note: '' });
      return str(x.ammo) || str(x.total) ? { name: str(x.ammo), box: str(x.box), total: x.total, used: x.used } : null;
    }).filter(Boolean);
  }
  if ((ch.crafts || []).length) {
    const left = [];
    ch.crafts.forEach(c => {
      const txt = `【加工】${str(c.name)}${str(c.eff) ? '：' + str(c.eff) : ''}${str(c.price) ? `（${c.price}G）` : ''}`;
      const w = (ch.weapons || []).concat(ch.armors || []).find(x => str(x.name) && str(x.name) === str(c.item));
      const acc = Object.values(ch.acc || {}).find(x => x && str(x.name) && str(x.name) === str(c.item));
      if (w) w.note = [str(w.note), txt].filter(Boolean).join(' ');
      else if (acc && !acc.craft) Object.assign(acc, { craft: true, craftName: str(c.name), craftEff: str(c.eff) });
      else if (str(c.name) || str(c.item)) left.push(`${str(c.item)}${txt}`);
    });
    if (left.length) ch.memo = [str(ch.memo), '舊版武具加工紀錄：', ...left].filter(Boolean).join('\n');
    ch.crafts = [];
  }
  (ch.curses || []).forEach(c => { if (c && !('desc' in c)) c.desc = ''; });
  if (!ch.chosen && Array.isArray(ch.picks) && ch.picks.length) {
    ch.chosen = {};
    ch.picks.forEach(k => { const own = str(k).split('|')[0]; (ch.chosen[own] = ch.chosen[own] || []).push(k); });
    ch.picks = [];
  }
  const lines = t => str(t).split('\n').map(x => x.trim()).filter(Boolean);
  if (!Array.isArray(ch.itemList)) ch.itemList = lines(ch.items).map(n => ({ cat: '', name: n, qty: '', note: '' }));
  if (!Array.isArray(ch.itemCats)) ch.itemCats = DEF_ITEM_CATS.slice();
  if (!Array.isArray(ch.langList)) ch.langList = lines(ch.languages).map(n => ({ cat: '其他', name: n, talk: true, read: true, note: '' }));
  if (!Array.isArray(ch.langCats) || !ch.langCats.length) ch.langCats = DEF_LANG_CATS.slice();
  if (!Array.isArray(ch.customSkills)) ch.customSkills = [];
  if (!ch.langs || typeof ch.langs !== 'object') {
    ch.langs = {}; ch.langCustom = ch.langCustom || [];
    (ch.langList || []).forEach(l => {
      const n = str(l.name); if (!n) return;
      const how = str(l.cat) === '種族初期' ? '種族初期' : '特殊', when = str(l.cat) === '種族初期' ? '初期' : '';
      const x = { tm: l.talk ? how : '', tl: l.talk ? when : '', rm: l.read ? how : '', rl: l.read ? when : '', note: str(l.note) };
      if (M.langs.some(d => str(d['名稱']) === n)) ch.langs[n] = x; else ch.langCustom.push(Object.assign({ name: n }, x));
    });
  }
  if (!Array.isArray(ch.langCustom)) ch.langCustom = [];
  if (!Array.isArray(ch.swaps)) ch.swaps = [];
  if (!ch.featSlots || typeof ch.featSlots !== 'object') {
    ch.featSlots = {};
    (ch.feats || []).forEach(f => {
      if (!str(f.name)) return;
      let k = String(num(f.lv));
      if (!FEAT_SLOTS.includes(k) || ch.featSlots[k]) k = FEAT_SLOTS.find(x => !ch.featSlots[x]) || k;
      ch.featSlots[k] = f.name;
    });
  }
  if (!ch.acc) {
    ch.acc = {}; ch.accAdd = ch.accAdd || {};
    const ren = { 頸: '脖子', 背: '背後' };
    (ch.accs || []).filter(a => str(a.name)).forEach(a => {
      const k = ren[a.slot] || a.slot || '其他';
      if (!ch.acc[k]) ch.acc[k] = { name: a.name, eff: a.eff || '', mod: a.mod || '' };
      else { ch.acc[k + '+'] = { name: a.name, eff: a.eff || '', mod: a.mod || '' }; ch.accAdd[k] = true; }
    });
  }
  if (!ch.accAdd) ch.accAdd = {};
  if (!ch.marks) ch.marks = {};
  if (!Array.isArray(ch.accSpare)) ch.accSpare = [];
  if (!Array.isArray(ch.accs)) {
    ch.accs = ACC_SLOTS.map(slot => ({ slot, name: '', eff: '', mod: '' }));
    (ch.armors || []).filter(a => a.slot && !['鎧', '盾', '其他'].includes(a.slot)).forEach(a => {
      const row = ch.accs.find(x => x.slot === a.slot && !x.name);
      if (row) { row.name = a.name; row.eff = a.note || ''; }
    });
    ch.armors = (ch.armors || []).filter(a => !a.slot || ['鎧', '盾', '其他'].includes(a.slot));
  }
  (ch.log || []).forEach(x => {
    if (x.exp !== undefined && x.expTask === undefined) { x.expTask = x.exp; delete x.exp; }
    if (!x.g) x.g = {};
  });
  if (ch.growth && Object.values(ch.growth).some(v => num(v)) && ch.log && ch.log[0]) {
    STATS.forEach(([, , box]) => { ch.log[0].g[box] = num(ch.log[0].g[box]) + num(ch.growth[box]); });
    ch.growth = {};
  }
  return ch;
}

  const raceSel = sepSelect('race', Object.entries(groups).map(([g, ns]) => [g, ns.map(n => [n, n])]), CH.race);

      ${fld('汙穢增加', inp('taint', { num: true }))}
    </div>
    ${race ? `<p class="muted" style="font-size:12px;margin:10px 0 0">${['特殊能力', '弱點'].filter(k => str(race[k])).map(k => `${k}：${esc(race[k])}`).join('　')}${str(race['不可習得技能']) ? '　不可習得技能：' + esc(race['不可習得技能']) : ''}</p>` : ''}
  </div>

  <div class="card glass"><h2>種族特徵<span class="sub">冒險者等級達到後自動獲得</span></h2>
    ${abilityTable(owned, R, { noLv: true, cols: colsFor('自動特技') })}
    ${later.length ? `<div class="gt" style="margin-top:12px">後續獲得</div><div style="display:flex;flex-wrap:wrap;gap:6px">${later.map(t => `<span class="chip">Lv${esc(t['等級'])} ${esc(t['名稱'])}</span>`).join('')}</div>` : ''}
  </div>

  <div class="card glass"><h2>能力值<span class="sub">${race ? '種族骰　' + STATS.map(([, , b]) => `${b} ${esc(race[b + '骰'] || '?')}`).join('　') : ''}</span></h2>
    <div class="fgrid" style="grid-template-columns:repeat(3,1fr);margin-bottom:10px">${fld('技', inp('base.技', { num: true }))}${fld('體', inp('base.體', { num: true }))}${fld('心', inp('base.心', { num: true }))}</div>
    <div class="tw"><table><thead><tr><th>能力值</th><th></th><th class="n">骰值</th><th class="n">初始調整</th><th class="n">成長</th><th class="n">暫調</th><th class="n">合計</th><th class="n">加值</th></tr></thead><tbody>
      ${STATS.map(([n, b, box]) => `<tr><td>${n}</td><td class="muted" style="font-size:12px">${b}＋${box}</td><td style="width:76px">${inp('roll.' + box, { num: true })}</td><td style="width:76px">${inp('adj.' + box, { num: true })}</td><td class="n muted">${R.growth[box] || '—'}</td><td style="width:76px">${inp('temp.' + box, { num: true })}</td><td class="n"><b data-live="${n}"></b></td><td class="n" style="color:var(--accent);font-weight:600" data-live="${n}加值"></td></tr>`).join('')}

function gskillCard(R) {
  const list = CH.gskills || [];
  const dl = `<datalist id="gslist">${M.gskills.map(g => `<option value="${esc(g['名稱'])}">`).join('')}</datalist>`;
  const quick = list.filter(x => str(x.name) && gsLv(x) > 0).map(x => {
    const d = M.gskills.find(g => str(g['名稱']) === str(x.name));
    const L = gsLv(x);
    const lines = d ? str(d['判定']).split('\n').filter(Boolean).map(l => {
      const m = l.match(/【(靈巧度|敏捷度|力量|生命力|智力|精神力)】/);
      return `<div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(l.replace(/^[①-⑳]/, ''))}</span>${m ? `<b style="white-space:nowrap">2D6+${L + num(R.v[m[1] + '加值'])}</b>` : ''}</div>`;
    }).join('') : '<span class="muted">自訂技能：基準值＝等級＋能力加值</span>';
    return `<div class="ab"><div class="h"><b>${esc(x.name)}</b><span class="chip accent">Lv${L}</span></div>
      <div style="font-size:13px">${lines}</div>
      ${d && str(d['獎勵']) ? `<div class="note">獎勵：${esc(d['獎勵'])}</div>` : ''}
      <div class="note">${STATS.map(([n]) => `${n.replace('度', '')} ${L + num(R.v[n + '加值'])}`).join('　')}</div></div>`;
  }).join('');
  const F = gsFree();
  return `<div class="card glass"><h2>一般技能<span class="sub">初期免費點 <b data-live="gsfree"></b>　成長點 剩餘 <b data-live="gsleft"></b>（合計 <span data-live="gspts"></span>）</span></h2>
    ${dl}
    <p class="muted" style="margin:0 0 8px;font-size:13px">建角時有 <b>${F.pool}</b> 點免費分配：每 1 等 1 點，單一技能最高 ${F.cap} 等，可集中或分散，填於「初期等級」，不消耗成長點。其後升級依表消耗成長點（升到 2 等 1 點、3 等 2 點、4 等 3 點…）。</p>
    ${rowsTable('gskills', [{ key: 'name', label: '一般技能', w: 140, list: 'gslist' }, { key: 'init', label: '初期等級（免費）', num: true, w: 70 }, { key: 'lv', label: '現在等級', num: true, w: 60 }, { live: 'gscost', label: '消耗成長點' }, { live: 'gsinit', label: '' }], '新增一般技能')}
    <details style="margin-top:10px"><summary>成長點來源</summary>
      <label style="display:flex;gap:6px;align-items:center;font-size:13px;margin:8px 0">${EDIT() ? `<input type="checkbox" data-path="gsSync"${CH.gsSync === false ? '' : ' checked'}>` : (CH.gsSync === false ? '—' : IC.check)} 成長次數同步（成長紀錄的成長次數 ${R.growthCount} 也算成長點）</label>
      ${rowsTable('gsExtra', [{ key: 'when', label: '獲得時機', w: 140 }, { key: 'pts', label: '成長點', num: true, w: 60 }], '新增成長點')}
    </details>
    ${quick ? `<div class="gt" style="margin-top:12px">判定速查</div><div class="abl">${quick}</div>` : ''}
  </div>`;
}

const LANG_HOW_TALK = ['賢者', '吟遊詩人', '種族初期', '一般技能', '特殊'];
const LANG_HOW_READ = ['賢者', '種族初期', '一般技能', '特殊'];
const LANG_WHEN = ['初期', '技能'].concat(Array.from({ length: 17 }, (_, i) => String(i + 1)), ['特殊']);
let LANG_ONLY = null;
function langLearned(x) { return !!(x && (str(x.tm) || str(x.rm))); }
function langTable(R) {
  const race = R.race;
  const skillLangs = M.skills.filter(s => num(R.v[s['名稱']]) > 0 && str(s['附帶語言'])).map(s => `${s['名稱']}：${s['附帶語言']}`);
  const only = LANG_ONLY === null ? !EDIT() : LANG_ONLY;
  const L = CH.langs || {};
  const groups = {};
  M.langs.forEach(l => { (groups[str(l['地區'])] = groups[str(l['地區'])] || []).push(l); });
  const usable = o => !['賢者', '吟遊詩人'].includes(o) || num(R.v[o]) > 0;
  const sel = (path, opts, ok) => !ok ? '<span class="muted">╳</span>'
    : EDIT() ? `<select data-path="${path}" style="padding:4px 6px"><option value="">－</option>${opts.filter(o => usable(o) || o === str(getPath(CH, path))).map(o => `<option${o === str(getPath(CH, path)) ? ' selected' : ''}>${o}</option>`).join('')}</select>`
    : `<span>${esc(str(getPath(CH, path)) || '－')}</span>`;
  const row = (base, name, canT, canR, extra = '') => {
    const learned = langLearned(getPath(CH, base));
    return `<tr style="${learned ? '' : 'opacity:.75'}"><td style="min-width:120px">${extra || `<b data-tipkey="${esc(name)}" style="font-weight:${learned ? 700 : 400}">${esc(name)}</b>`}</td>
      <td class="lt lt1">${sel(base + '.tm', LANG_HOW_TALK, canT)}</td><td class="lt">${sel(base + '.tl', LANG_WHEN, canT)}</td>
      <td class="lr lr1">${sel(base + '.rm', LANG_HOW_READ, canR)}</td><td class="lr">${sel(base + '.rl', LANG_WHEN, canR)}</td>
      ${extra && EDIT() ? `<td><button class="btn small danger" data-del="${base}" title="刪除">${ic('trash-2')}刪除</button></td>` : '<td></td>'}</tr>`;
  };
  const count = how => Object.values(L).concat(CH.langCustom || []).reduce((a, x) => a + (str(x.tm) === how ? 1 : 0) + (str(x.rm) === how ? 1 : 0), 0);
  const learnedN = Object.keys(L).filter(k => langLearned(L[k])).length + (CH.langCustom || []).filter(langLearned).length;
  return `<div class="card glass"><h2>語言<span class="sub">已習得 ${learnedN} 種</span></h2>
    ${race && str(race['初期語言']) ? `<p class="muted" style="font-size:12px;margin:0 0 4px">種族初期語言：${esc(race['初期語言'])}</p>` : ''}
    ${skillLangs.length ? `<p class="muted" style="font-size:12px;margin:0 0 4px">技能附帶：${esc(skillLangs.join('　'))}</p>` : ''}
    <p class="muted" style="font-size:12px;margin:0 0 8px">${['賢者', '吟遊詩人'].filter(n => num(R.v[n]) > 0 || count(n)).map(n => `用${n}習得：${count(n)} 項（${n} Lv${num(R.v[n])}）`).join('　')}</p>
    <label style="display:inline-flex;gap:6px;align-items:center;font-size:13px;margin-bottom:8px"><input type="checkbox" id="lang-only"${only ? ' checked' : ''}>只顯示已習得</label>
    <div class="tw"><table class="log langt"><thead>
      <tr><th rowspan="2" style="vertical-align:bottom">語言</th><th colspan="2" class="lt lt1 lgh">會話</th><th colspan="2" class="lr lr1 lgh">讀寫</th><th rowspan="2"></th></tr>
      <tr><th class="lt lt1">習得方式</th><th class="lt">習得等級</th><th class="lr lr1">習得方式</th><th class="lr">習得等級</th></tr></thead><tbody>
      ${Object.entries(groups).map(([g, list]) => {
        const rows = list.filter(l => !only || langLearned(L[str(l['名稱'])]));
        if (!rows.length) return '';
        return `<tr><td colspan="6" class="muted" style="font-size:12px;text-align:center;letter-spacing:.1em">───── ${esc(g)} ─────</td></tr>` +
          rows.map(l => row('langs.' + str(l['名稱']).replace(/\./g, '．'), str(l['名稱']), str(l['會話']) === '可', str(l['讀寫']) === '可')).join('');
      }).join('')}
      ${(CH.langCustom || []).length ? `<tr><td colspan="6" class="muted" style="font-size:12px;text-align:center;letter-spacing:.1em">───── 自填語言 ─────</td></tr>` +
        CH.langCustom.map((x, i) => row(`langCustom.${i}`, x.name, true, true, inp(`langCustom.${i}.name`, { ph: '語言名稱' }))).join('') : ''}
    </tbody></table></div>
    ${EDIT() ? `<button class="btn small" data-add="langCustom" style="margin-top:8px">${ic('plus')}新增自填語言（資料庫沒有的）</button>` : ''}
  </div>`;
}

function featOptions(slot, R) {

  R.owned.filter(a => a.how === '自動' || a.how === '種族').forEach(a => before.add(bare(a['名稱'])));
  const taken = new Set(order.filter(k => k !== slot).map(k => bare(CH.featSlots?.[k])).filter(Boolean));
  const ctx = { warn: () => {}, has: n => before.has(bare(n)), get: n => n === '冒險者Lv' ? slotLv : R.ctx.get(n) };
  const groups = {};
  M.feats.forEach(f => {
    const n = str(f['名稱']);

    if (c && !truthy(evalExpr(c, ctx))) return;
    (groups[str(f['分類'])] = groups[str(f['分類'])] || []).push([n, (str(f['記號']) ? f['記號'] + ' ' : '') + n]);
  });
  return Object.entries(groups);
}

    const cells = (c, r) => { const x = CH.cards?.[c]?.[r] || {}; const left = num(x.t) - num(x.u), bg = `background:rgba(${CARD_RGB[c]},${RK_A[r]})`;
      return `<td class="g0" style="${bg}">${inp(`cards.${c}.${r}.t`, { num: true })}</td><td style="${bg}">${inp(`cards.${c}.${r}.u`, { num: true })}</td>`

        <tr>${RK.map(() => '<th class="g0">總數</th><th>已使用</th><th>剩餘</th>').join('')}</tr></thead>

  if (L('騎手') > 0) {

    const pc = [['part', '部位', 70], ['hit', '命中', 48], ['dmg', '打擊點', 72], ['eva', '迴避', 48], ['def', '防護', 48], ['hp', 'HP', 48], ['mp', 'MP', 48], ['rl', '生命抵抗', 56], ['rm', '精神抵抗', 56], ['wpn', '騎獸用武器', 100], ['arm', '防具', 100], ['wmp', '武器MP', 50], ['amp', '防具MP', 50]];
    out.push(`<div class="card glass"><h2>騎手：騎獸<span class="sub">騎獸等級＝MIN(騎手等級, 適正最高)</span></h2>
      ${(CH.mounts || []).map((m, i) => {
        const lo = num(m.lvMin), hi = num(m.lvMax);
        const mlv = str(m.lvMax) === '' ? rl : Math.min(rl, hi);

          ${fld('名稱', inp(`mounts.${i}.name`))}${fld('分類', inp(`mounts.${i}.cat`))}${fld('適正等級 最低', inp(`mounts.${i}.lvMin`, { num: true }))}${fld('適正等級 最高', inp(`mounts.${i}.lvMax`, { num: true }))}
          <div class="f"><span class="fl">騎獸等級</span><div class="ro"><b style="color:${bad ? 'var(--hp)' : ''}">${bad ? '等級不足' : mlv}</b></div></div>
          ${fld('部位數', inp(`mounts.${i}.partsN`, { num: true }))}${fld('移動速度', inp(`mounts.${i}.speed`))}${fld('智能', inp(`mounts.${i}.intel`))}${fld('語言', inp(`mounts.${i}.lang`))}
          ${fld('核心部位', inp(`mounts.${i}.core`))}${fld('弱點', inp(`mounts.${i}.weak`))}${fld('知覺', inp(`mounts.${i}.sense`))}

    const rk = ['迪亞波羅', '德雷克', '巴西利斯克', '巨螯蠍人'].find(k => str(CH.race).includes(k));
    if (!rk) out.push(`<div class="card glass"><h2>部位操者：部位・魔裝</h2><span class="muted">部位操者限迪亞波羅、德雷克、巴西利斯克、巨螯蠍人使用，請先於「基本資料」選擇種族。</span></div>`);
    else {
      const mz = CH.mz || [];
      const has = k => mz.some(x => str(x).includes(k));
      const plus = (...ks) => ks.reduce((a, [k, n]) => a + (has(k) ? n : 0), 0);
      const parts = M.partRace.filter(r => str(r['種族']) === rk).sort((a, b) => num(a['順序']) - num(b['順序']));
      const tab = part => M.partTab.find(r => str(r['部位']) === str(part) && num(r['部位操者等級']) === Math.min(15, lv)) || {};

      const defUp = plus(['【部位耐久增強】', 1], ['【部位耐久超增強】', 1], ['【部位耐久極增強】', 2]);
      const hitUp = plus(['【部位即應&強化】', 1], ['【部位超強化】', 1], ['【部位極強化】', 1]);
      const B = k => num(R.v[k + '加值']);
      const prow = (r, i) => { const core = i === 0, t = tab(r['部位']), evil = str(r['部位']).includes('邪眼') ? 2 : 0;
        return `<tr><td><b>${esc(r['部位'])}</b>${core ? '<div class="muted" style="font-size:11px">核心部位＝角色本身</div>' : ''}</td><td>${esc(r['天生武器'])}</td><td style="font-size:12px">${esc(r['適用種族特徵'])}</td>

      const okFor = (m, others) => str(m['前提']).split(/[;；]/).map(x => x.trim()).filter(Boolean).every(c => {
        const neg = c.startsWith('!'), body = neg ? c.slice(1) : c, [kind, txt] = [body.split(':')[0], body.slice(body.indexOf(':') + 1)];
        const hit = kind === '魔裝' ? others.some(o => str(o).includes(txt)) : kind === '特技' ? fsNames.includes(txt) : kind === '非種族' ? rk === txt : true;
        return kind === '非種族' ? !hit : (neg ? !hit : hit);
      });
      const pool = M.mz.filter(m => ['共通', rk].includes(str(m['種族'])));
      const slots = Array.from({ length: Math.max(lv, mz.filter(Boolean).length) }, (_, i) => {
        const cur = str(mz[i]), others = mz.filter((x, j) => j !== i && x);
        const opts = [['', '—']].concat(pool.filter(m => num(m['等級']) <= i + 1 && !others.includes(str(m['名稱'])) && okFor(m, others)).map(m => [str(m['名稱']), `${m['名稱']}（${m['種族'] === '共通' ? '共通' : m['種族']}・Lv${m['等級']}）`]));
        if (cur && !opts.some(o => o[0] === cur)) opts.push([cur, cur + '（不符合條件）']);
        const d = M.mz.find(m => str(m['名稱']) === cur);
        return `<tr${i + 1 > lv ? ' class="dim"' : ''}><td class="n"><b>${i + 1}</b></td>
          <td style="min-width:230px">${EDIT() ? `<select data-path="mz.${i}">${opts.map(([v, l]) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>` : (cur ? `<b>${esc(cur)}</b>` : '<span class="muted">—</span>')}</td>
          <td class="desc" style="font-size:13px">${d ? (str(d['效果']) ? `<span class="effx">${esc(d['效果'])}</span>` : '<span class="muted">（尚未填寫）</span>') : ''}</td></tr>`;
      }).join('');
      out.push(`<div class="card glass"><h2>部位操者：部位・魔裝<span class="sub">${esc(rk)}・部位操者 Lv${lv}</span></h2>
        <div class="gt">部位（依種族自動帶出）</div>
        ${tbl(['部位', '天生武器', '適用種族特徵', 'HP', 'MP', '防護點', '命中', '迴避', '傷害修正'], parts.map(prow))}
        <div class="gt" style="margin-top:12px">魔裝<span class="muted" style="font-weight:400;font-size:12px">　每升 1 級選擇 1 項；僅列出符合種族、等級與前提條件者</span></div>
        <div class="tw"><table class="abt"><thead><tr><th class="n" style="width:70px">習得等級</th><th>名稱</th><th class="desc">概要</th></tr></thead><tbody>${slots}</tbody></table></div>
        ${rk === '德雷克' || rk === '巴西利斯克' ? `<div class="fgrid" style="margin-top:10px">${rk === '德雷克' ? fld('〈德雷克魔劍〉', inp('drake.sword')) : fld('〈瞳石〉顏色（寶石）', inp('drake.eye'))}</div>` : ''}
      </div>`);
    }
  }
  return out.join('');
}

const PROST_SLOTS = [['左手臂', '手臂'], ['右手臂', '手臂'], ['左手掌', '手掌'], ['右手掌', '手掌'], ['左大腿', '大腿'], ['右大腿', '大腿'], ['左腳掌', '腳掌'], ['右腳掌', '腳掌'], ['下半身', '下半身']];
function prostCard() {
  const P = CH.prost || {};
  const byPart = part => M.prost.filter(x => str(x['部位']) === part);
  const loadOf = name => num((M.prost.find(x => str(x['名稱']) === str(name)) || {})['負荷']);
  const heads = byPart('頭部');
  const total = PROST_SLOTS.reduce((a, [slot]) => a + loadOf(P[slot]), 0) + heads.reduce((a, h) => a + (P.head?.[h['名稱']] ? num(h['負荷']) : 0), 0);
  const stage = total >= 10 ? 4 : total >= 8 ? 3 : total >= 5 ? 2 : total >= 0.5 ? 1 : 0;
  const stageRow = M.ref.find(x => str(x['表']) === '負荷階段表' && num(x['值']) === stage);
  const used = total > 0;
  return `<div class="card glass"><h2>魔動義體<span class="sub">負荷 ${total}・階段 ${stage}</span></h2>
    <div class="fgrid">${PROST_SLOTS.map(([slot, part]) => fld(slot, inp(`prost.${slot}`, { opts: [['', '—']].concat(byPart(part).map(x => [x['名稱'], `${x['名稱']}（負荷${x['負荷']}）`])) }))).join('')}</div>
    <div class="gt" style="margin-top:10px">頭部</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px 18px">${heads.map(h => EDIT() ? `<label style="display:inline-flex;gap:5px;align-items:center"><input type="checkbox" data-path="prost.head.${esc(h['名稱'])}"${P.head?.[h['名稱']] ? ' checked' : ''}>${esc(h['名稱'])}（${h['負荷']}）</label>` : (P.head?.[h['名稱']] ? `<span class="chip">${esc(h['名稱'])}</span>` : '')).join('')}</div>
    ${stageRow ? `<div class="note" style="margin-top:10px"><b>負荷階段 ${stage}：</b>${esc(stageRow['內容'])}</div>` : ''}
    <details style="margin-top:8px"><summary>特殊失敗表</summary>${`<div class="tw"><table><tbody>${M.ref.filter(x => str(x['表']) === '特殊失敗表').map(x => `<tr><td class="n">${esc(x['值'])}</td><td>${esc(x['內容'])}</td></tr>`).join('')}</tbody></table></div>`}</details>
  </div>`;
}

function syncCurses() {
  const srcs = [];

  CH.curses = (CH.curses || []).filter(c => !c.auto || srcs.includes(str(c.src)) || str(c.name) || str(c.desc));

function accLayout(R) {
  const race = R.v['種族'], lv = R.lv;
  const pix = /小矮靈/.test(race), scorp = /巨螯蠍人/.test(race), centaur = /半人馬/.test(race);
  const col1 = ['頭部', '臉', '耳', '脖子', '背後'].map(k => ({ key: k, label: k, add: true }));
  const col2 = [{ key: '右手', label: '右手', add: true }, { key: '左手', label: '左手', add: true },
    { key: '腰', label: scorp ? (lv >= 6 ? '背後' : '╳') : '腰', add: true, off: scorp && lv < 6 },
    { key: '腳', label: centaur ? '腰' : scorp ? '╳' : '腳', add: true, off: scorp },
    { key: '其他', label: '其他', add: true }];
  const col3 = [1, 2, 3, 4, 5].map(i => {
    const hand = pix && (i === 1 || (i === 2 && lv >= 6));
    return { key: '追加' + i, label: hand ? '[看不見的手]' : '追加欄位', free: !hand };
  });
  return [col1, col2, col3];
}

function kvGroups(listKey, catsKey, cols, addLabel) {
  const list = CH[listKey] || [], cats = CH[catsKey] || [];
  const used = [...new Set(list.map(x => str(x.cat)))];
  const all = cats.concat(used.filter(c => c && !cats.includes(c)));

  const catOpts = [['', '未分類']].concat(all.filter(Boolean));
  return `${EDIT() ? `<label class="f" style="margin-bottom:12px">分類（自訂名稱，以逗號分隔；不分類請留空）<input data-cats="${catsKey}" value="${esc(cats.join('、'))}" placeholder="例：冒險道具、消耗品、貴重品"></label>` : ''}
    ${all.map(cat => {
      const rows = list.map((x, i) => [x, i]).filter(([x]) => str(x.cat) === cat);
      if (!rows.length && !EDIT()) return '';
      return `${all.length > 1 ? `<div class="gt">${esc(cat || '未分類')}（${rows.length}）</div>` : ''}

}

function pickImage(cb) {
  const f = document.createElement('input'); f.type = 'file'; f.accept = 'image/*';
  f.onchange = () => { const file = f.files[0]; if (file) cb(file); };
  f.click();
}
function shrinkImage(file, max = 640) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL(/png|gif|webp/.test(file.type) ? 'image/png' : 'image/jpeg', .88));
    };
    img.onerror = rej; img.src = url;
  });
}
async function uploadPortrait(target = 'image') {
  pickImage(async file => {

      if (CH.id && KEY) url = await api('uploadImage', CH.id, KEY, data, file.name, str(getPath(CH, target)));
      setPath(CH, target, url);
      toast(CH.id ? '已上傳，請按儲存' : '已暫存，建立角色時一併上傳');
      renderSheet();

  });
}

    r.onload = () => {
      let ch = null; const t = String(r.result);
      try { const m = t.match(/window\.OFFLINE=(\{[^<]*?\});PARAMS=\{id:'local'/); ch = m ? JSON.parse(m[1]).ch : JSON.parse(t); } catch (err) {}
      if (!ch || typeof ch !== 'object' || !('skills' in ch || 'name' in ch)) { $('#ice', bg).textContent = '無法讀取此檔案'; return; }
      bg.remove();
      CH = migrate(ch); CH.id = ''; KEY = ''; CH.event = ''; if (CH.vis === 'private') CH.vis = 'public';
      remake(); PAGE = 'sheet'; renderSheet(); window.scrollTo(0, 0);
      toast('已匯入，請確認公開程度後儲存');
    };
    r.readAsText(f);
  };
}
function createDialog() {
  return new Promise(res => {
    const bg = modal(`<h3>儲存角色卡</h3>
      <label class="f">玩家ID<input id="cd-owner" value="${esc(str(CH.owner))}" placeholder="例：Discord 名稱"></label>
      <div class="gt" style="margin-top:10px">公開程度</div>
      <div class="vislist">${VIS.map(([k, l, d]) => `<label class="visopt"><input type="radio" name="cd-vis" value="${k}"${CH.vis === k ? ' checked' : ''}><span><b>${l}</b><small class="muted">${d}</small></span></label>`).join('')}</div>
      <div id="cd-pw"><label class="f" style="margin-top:10px">編輯密碼<input id="p1" type="password" autocomplete="new-password"></label>
      <label class="f" style="margin-top:8px">再輸入一次<input id="p2" type="password" autocomplete="new-password"></label></div>
      <div class="toolbar" style="margin-top:12px"><span class="muted" id="pm">${PW_HINT}</span><button class="btn ghost" id="pc" style="margin-left:auto">取消</button><button class="btn primary" id="po">確定</button></div>`);
    const sync = () => { const v = $('[name="cd-vis"]:checked', bg).value; $('#cd-pw', bg).style.display = v === 'private' ? 'none' : ''; $('#pm', bg).textContent = v === 'private' ? '非公開不需要密碼' : PW_HINT; $('#pm', bg).style.color = ''; };
    $$('[name="cd-vis"]', bg).forEach(r => r.onchange = sync); sync();
    const done = v => { bg.remove(); res(v); };
    $('#pc', bg).onclick = () => done(null);
    $('#po', bg).onclick = () => {
      const vis = $('[name="cd-vis"]:checked', bg).value, owner = $('#cd-owner', bg).value.trim();
      if (vis === 'private') return done({ vis, owner });
      const a = $('#p1', bg).value, b = $('#p2', bg).value, pm = $('#pm', bg);
      if (!PW_RE.test(a)) { pm.textContent = PW_HINT; pm.style.color = 'var(--hp)'; return; }
      if (a !== b) { pm.textContent = '兩次輸入不一致'; pm.style.color = 'var(--hp)'; return; }
      done({ vis, owner, pw: a });
    };
  });
}
function confirmBox(title, text, okLabel) {
  return new Promise(res => {
    const bg = modal(`<h3>${title}</h3><p>${text}</p><div class="toolbar"><button class="btn ghost" id="cb-n" style="margin-left:auto">取消</button><button class="btn primary" id="cb-y">${okLabel}</button></div>`);
    $('#cb-n', bg).onclick = () => { bg.remove(); res(false); };
    $('#cb-y', bg).onclick = () => { bg.remove(); res(true); };
  });
}
async function save() {
  const b = $('#b-save');
  if (OFF) { downloadHtml(); return; }
  const R = compute(CH);
  const summary = { name: CH.name, player: CH.player, race: R.v['種族'], lv: R.lv };
  const reset = () => { if (b) { b.disabled = false; b.innerHTML = saveLabel(); } };
  try {
    if (!CH.id) {
      const opt = await createDialog();
      if (!opt) return;
      CH.owner = opt.owner; CH.vis = opt.vis;
      if (opt.vis === 'private') { downloadHtml(); renderSheet(); return; }
      b.disabled = true; b.textContent = '儲存中…';
      const res = await api('createCharacter', JSON.stringify(CH), summary, opt.pw);
      KEYS.set(res.id, res.key);
      const temp = ['image', 'coco.icon'].filter(k => /^data:/.test(str(getPath(CH, k))));
      if (temp.length) {
        try {
          for (const k of temp) setPath(CH, k, await api('uploadImage', res.id, res.key, getPath(CH, k), 'portrait', ''));
          CH.id = res.id; await api('saveCharacter', res.id, res.key, JSON.stringify(CH), summary);
        } catch (e) { toast('圖片上傳失敗：' + (e && e.message || e)); }
      }
      toast('角色已建立，日後可使用密碼編輯');
      go({ id: res.id });
    } else if (CH.vis === 'private') {
      if (!(await confirmBox('改為非公開', '將下載 HTML 檔，並<b>刪除伺服器上的這張角色卡</b>（分享連結將失效）。日後可由「角色列表 → 匯入角色」重新上傳。', '下載並刪除'))) return;
      downloadHtml();
      await api('deleteCharacter', CH.id, KEY);
      KEYS.set(CH.id, ''); CH.id = ''; KEY = '';
      toast('已下載，伺服器上的資料已刪除'); renderSheet();
    } else {
      b.disabled = true; b.textContent = '儲存中…';
      const hadCode = !!CH._evcode;
      await api('saveCharacter', CH.id, KEY, JSON.stringify(CH), summary);
      if (hadCode) delete CH._evcode;
      toast(CH.vis === 'unlisted' ? '已儲存（半公開：僅持有連結者可檢視）' : '已儲存');
    }
  } catch (e) { toast('儲存失敗：' + (e && e.message || e)); }
  finally { reset(); }
}

applyTheme();
route();
</script>
